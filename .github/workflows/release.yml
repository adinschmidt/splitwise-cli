name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: splitwise
            asset: splitwise-linux-x86_64
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: splitwise
            asset: splitwise-macos-x86_64
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: splitwise
            asset: splitwise-macos-arm64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: splitwise.exe
            asset: splitwise-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build release binary
        run: cargo build --release --locked --bin splitwise --target ${{ matrix.platform.target }}

      - name: Prepare release asset
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary }} ${{ matrix.platform.asset }}

      - name: Prepare release asset
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.platform.target }}/release/${{ matrix.platform.binary }} ${{ matrix.platform.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.asset }}
          path: ${{ matrix.platform.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten downloaded artifacts
        run: |
          mkdir -p dist
          find release-artifacts -type f -maxdepth 2 -exec cp {} dist/ \;
          ls -la dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
