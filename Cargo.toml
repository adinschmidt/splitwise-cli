[package]
name = "splitwise-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "splitwise"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
directories = "6.0"
dotenvy = "0.15"
http = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1.46", features = ["macros", "rt-multi-thread"] }
toml = "0.8"

[dev-dependencies]
assert_cmd = "2.0"
insta = "1.43"
predicates = "3.1"
tempfile = "3.15"
wiremock = "0.6"
