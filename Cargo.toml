[package]
name = "splitwise-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "splitwise"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.0", features = ["derive", "env"] }
comfy-table = "=7.2.2"
directories = "=6.0.0"
dotenvy = "=0.15.7"
http = "=1.4.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde_yaml = "=0.9.34+deprecated"
thiserror = "=2.0.18"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread"] }
toml = "=0.8.23"

[dev-dependencies]
assert_cmd = "=2.2.0"
insta = "=1.46.3"
predicates = "=3.1.4"
tempfile = "=3.27.0"
wiremock = "=0.6.5"
